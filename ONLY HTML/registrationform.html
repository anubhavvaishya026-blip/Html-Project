<html>
    <head>
        <title>
            Student Registration Form
        </title>
    </head>
    <body>
        <h1>Student Registration Form</h1>
        <hr>
        Full Name:<input type="text" placeholder="Enter Your Name"><br><br>
        Email:<input type="email" placeholder="Enter Your Email"><br><br>
        Date Of Birth:<input type="date"><br><br>
        Gender:<input type="radio" name="gender">Male
        <input type="radio" name="gender">Female <br><br>
        Mobile Number:<input type="tel" placeholder="Enter mobile Number"><br><br>
        Course:<select>
            <option>Select Course</option>
            <option>Computer Science Eng.</option>
            <option>Mechanical Eng.</option>
            <option>Electrical Eng.</option>
            <option>Electronics </option>
        </select> <br><br>
        Address: <br>
        <textarea rows="5" cols="25">
        </textarea><br><br>
        Upload Photo:<input type="file"><br><br>
        <input type="checkbox">I agree to the terms and conditions <br><br>
        <button>Register</button>
        <button>Clear</button>

    </body>
</html>
